const THEME_ORDER = ['Light','Dark','Black','Ocean','Forest','Purple','Sunset','Pink','Maroon'];
const WHITE=[255,255,255], MARKER=[30,41,59], GREEN=[22,163,74], GREEN_HOVER=[34,180,90], RED_UI=[220,53,69], AMBER=[217,119,6], GREY_PILL=[100,116,139];

  ['4','Connect four to win','Line up 4 discs in a row, column or diagonal. A full board is a draw.']];

const ABOUT_TEXT = 'Mini-AlphaZero is a Connect Four game where you can play against different AI agents, from a simple random player to a neural network guided by Monte Carlo Tree Search. The neural agent learns through self-play: a CNN predicts good moves (policy) and who is winning (value), and the search uses both to choose strong moves.';
const ABOUT_AGENTS = [['Random AI','Plays any legal column. A simple baseline.'],['Minimax','Looks several moves ahead and picks the best outcome.'],['Alpha-Beta','Minimax with pruning, so it searches deeper and faster.'],['Standard MCTS','Runs many random simulations to find strong moves.'],['Neural MCTS','MCTS guided by a CNN trained through self-play.']];
const ABOUT_INFO = [['Student','Khadeeja'],['Roll No','24-BSCS-29'],['Instructor','Sir Abdul Rafio']];

/* ---------- canvas ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let S = 1;
function fit() {
  const foot = document.getElementById('foot').offsetHeight;
  const w = Math.min(window.innerWidth, (window.innerHeight - foot) * BASE_W / BASE_H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = w + 'px'; cv.style.height = (w * BASE_H / BASE_W) + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr * BASE_H / BASE_W);
  S = cv.width / BASE_W;
}
const rgb = (c, a) => a === undefined ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const shade = (c, f) => c.slice(0, 3).map(v => Math.max(0, Math.min(255, Math.floor(v * f))));
let T = THEMES.Light, themeName = 'Light';
const FONT = '"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif';
const F = { title:[32,1], start:[34,1], big:[36,1], med:[26,1], norm:[22,0], small:[18,1], hero:[68,1], body:[20,0], bodyB:[20,1] };
function text(s, x, y, f, color, anchor = 'topleft', alpha = 1) {
  const [size, bold] = F[f];
  ctx.font = `${bold ? '700 ' : ''}${size * 0.9}px ${FONT}`;
  const A = { topleft:['left','top'], center:['center','middle'], midleft:['left','middle'], midtop:['center','top'], topright:['right','top'] }[anchor];
  ctx.textAlign = A[0]; ctx.textBaseline = A[1]; ctx.globalAlpha = alpha; ctx.fillStyle = rgb(color || T.TEXT);
  ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
const measure = (s, f) => { const [size, bold] = F[f]; ctx.font = `${bold ? '700 ' : ''}${size * 0.9}px ${FONT}`; return ctx.measureText(s).width; };
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function fillRR(x, y, w, h, r, color) { rrect(x, y, w, h, r); ctx.fillStyle = rgb(color); ctx.fill(); }
function strokeRR(x, y, w, h, r, color, lw = 2) { rrect(x + lw / 2, y + lw / 2, w - lw, h - lw, r); ctx.strokeStyle = rgb(color); ctx.lineWidth = lw; ctx.stroke(); }
function disc(x, y, r, color, alpha) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = rgb(color, alpha); ctx.fill(); }
function ring(x, y, r, color, lw) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.strokeStyle = rgb(color); ctx.lineWidth = lw; ctx.stroke(); }
function wrap(s, f, maxw) { const lines = []; let cur = ''; for (const w of s.split(' ')) { const t = (cur + ' ' + w).trim(); if (measure(t, f) <= maxw) cur = t; else { if (cur) lines.push(cur); cur = w; } } if (cur) lines.push(cur); return lines; }
const inRect = (p, r) => p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h;
const R = (x, y, w, h) => ({ x, y, w, h });

/* ---------- sound ---------- */
let audio = null, soundOn = true;
function ensureAudio() { if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (audio && audio.state === 'suspended') audio.resume(); }
const TONES = { tick:[[988,55]], click:[[660,40],[880,50]], drop:[[300,40],[200,70]], win:[[523,110],[659,110],[784,110],[1047,260]] };
const VOL = { tick:.25, click:.25, drop:.35, win:.3 };
function playSound(name) {
  if (!soundOn || !audio) return;
  try {
    let t = audio.currentTime;
    for (const [f, ms] of TONES[name]) {
      const o = audio.createOscillator(), g = audio.createGain(), d = ms / 1000;
      o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(VOL[name] * .5, t + .005);
      g.gain.setValueAtTime(VOL[name] * .5, t + Math.max(.006, d - .03)); g.gain.linearRampToValueAtTime(0, t + d);
      o.start(t); o.stop(t + d + .02); t += d;
    }
  } catch (e) {}
}

/* ---------- game model ---------- */
class Game {
  constructor() { this.board = new Int8Array(42); this.current = 1; this.over = false; this.winner = null; }
  valid() { return validMoves(this.board); }
  make(col) {
    if (this.over || this.board[col] !== 0) return false;
    const p = this.current, r = play(this.board, col, p);
    if (winCells(this.board, r, col, p)) { this.over = true; this.winner = p; }
    else if (!this.valid().length) { this.over = true; this.winner = 0; }
    else this.current = -p;
    return true;
  }
}
function findWin(board, player) {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) for (const [dr, dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
    const cells = [0,1,2,3].map(i => [r + dr * i, c + dc * i]);
    if (cells.every(([a, b]) => a >= 0 && a < ROWS && b >= 0 && b < COLS && board[a * COLS + b] === player)) return cells;
  }
  return [];
}

/* ---------- app state ---------- */
const A = {
  state: 'gate', mode: 'ai', fade: 255, started: false, game: new Game(), moves: [], anim: null, winCells: [], lastMove: null, lastInfo: '',
  counted: false, resultKey: null, confetti: [], score: { you: 0, ai: 0, draw: 0 }, msg: '', opponent: 'Standard MCTS', level: 'Medium', human: 1,
  thinking: false, token: 0, neuralOK: false, neuralChecked: false, touched: false, revealed: 0,
  t0: performance.now(), introT0: performance.now(), mouse: { x: -1, y: -1 }, particles: []
};
const UI_TIME = 0.4 + 2 * 0.55 + 0.2 + 9 * 0.2 + 0.2;
for (let i = 0; i < 26; i++) A.particles.push({ x: Math.random() * BASE_W, y: -BASE_H + Math.random() * BASE_H * 2, v: 1.5 + Math.random() * 3, r: 16 + Math.random() * 24, p: Math.random() < .5 ? 1 : -1 });
const now = () => (performance.now() - A.introT0) / 1000;
const wave = () => (performance.now() - A.t0) / 1000;

/* rects */
const themeRect = R(BOARD_X + BOARD_W - 170, 30, 170, 52), backRect = R(themeRect.x - 150, 30, 140, 52);
const startRect = R(BOARD_X + BOARD_W / 2 - 170, BOARD_Y + BOARD_H / 2 - 20 - 45, 340, 90);
const soundRect = R(40, 30, 170, 52), homeThemeRect = R(BASE_W - 40 - 170, 30, 170, 52);
const homeButtons = [['ai','Play vs AI'],['two','2 Players'],['howto','How to Play'],['about','About'],['quit','Quit']].map(([id, label], i) => ({ id, label, r: R(BASE_W / 2 - 210, 395 + i * 74, 420, 62) }));
const third = (PW - 2 * GAP) / 3, half = (PW - GAP) / 2;
const buttons = [];
AI_NAMES.forEach((n, i) => buttons.push({ id: ['ai', n], r: R(PX, Y_BTN0 + i * BTN_STEP, PW, BTN_H), label: n }));
Object.keys(LEVELS).forEach((l, i) => buttons.push({ id: ['level', l], r: R(PX + i * (third + GAP), Y_LVL, third, SMALL_H), label: l }));
buttons.push({ id: ['side', 1], r: R(PX, Y_SIDE, half, SMALL_H), label: 'First (Yellow)' });
buttons.push({ id: ['side', -1], r: R(PX + half + GAP, Y_SIDE, half, SMALL_H), label: 'Second (Red)' });
[['undo','Undo'],['restart','Restart'],['exit','Menu']].forEach(([id, label], i) => buttons.push({ id, r: R(PX + i * (third + GAP), Y_ACT, third, ACT_H), label }));
let infoBackRect = R(0, 0, 0, 0);

/* ---------- worker ---------- */
let worker = null;
function startWorker() {
  try { worker = new Worker('agents.js'); } catch (e) { worker = null; A.neuralChecked = true; return; }
  worker.onmessage = e => {
    const m = e.data;
    if (m.type === 'ready') {
      A.neuralOK = m.ok; A.neuralChecked = true;
      if (m.ok && !A.touched && A.opponent === 'Standard MCTS') A.opponent = 'Neural MCTS';
    } else if (m.type === 'move') {
      if (m.token !== A.token || !A.thinking) return;
      const wait = Math.max(0, 450 - m.ms);
      setTimeout(() => {
        if (m.token !== A.token || !A.thinking) return;
        A.thinking = false;
        const valid = A.game.valid(); if (!valid.length) return;
        let mv = m.move;
        if (!valid.includes(mv)) { mv = valid[Math.floor(Math.random() * valid.length)]; A.msg = 'AI returned an invalid move; played randomly.'; }
        A.lastInfo = `AI played column ${mv + 1} in ${(m.ms / 1000).toFixed(2)}s`;
        place(mv);
      }, wait);
    }
  };
  worker.postMessage({ type: 'init', url: 'weights.json' });
}
function startAI() {
  A.token++; A.thinking = true;
  worker.postMessage({ type: 'move', agent: AGENT_ID[A.opponent], level: A.level, board: Array.from(A.game.board), player: A.game.current, token: A.token });
}

/* ---------- actions ---------- */
function setTheme(name) { themeName = name; T = THEMES[name]; buildMask(); document.body.style.background = rgb(T.BG); document.documentElement.style.background = rgb(T.BG); document.getElementById('foot').style.color = rgb(T.MUTED); try { localStorage.setItem('c4theme', name); } catch (e) {} }
function toggleTheme() { setTheme(THEME_ORDER[(THEME_ORDER.indexOf(themeName) + 1) % THEME_ORDER.length]); }
function newGame(started = false) {
  A.token++; A.thinking = false; A.started = started; A.game = new Game(); A.moves = []; A.anim = null; A.winCells = []; A.lastMove = null; A.lastInfo = ''; A.counted = false; A.resultKey = null; A.confetti = [];
}
function startMode(mode) { A.mode = mode; A.state = 'game'; A.fade = 255; A.msg = ''; A.score = { you: 0, ai: 0, draw: 0 }; newGame(false); }
function goHome() { A.token++; A.thinking = false; A.state = 'home'; A.fade = 255; A.msg = ''; }
function startGame() { if (!A.started) { A.msg = ''; A.started = true; } }
function humanTurn() { return A.started && !A.game.over && !A.anim && !A.thinking && (A.mode === 'two' || A.game.current === A.human); }
function place(col) {
  const g = A.game, p = g.current;
  let row = -1; for (let r = ROWS - 1; r >= 0; r--) if (g.board[r * COLS + col] === 0) { row = r; break; }

  A.anim = { row, col, player: p, y: BOARD_Y - CELL / 2, vy: 0, bounced: false };
  return true;
}
function humanMove(col) { if (humanTurn() && A.game.valid().includes(col)) place(col); }
function undo() {
  if (!A.started || !A.moves.length || A.anim) return;
  if (A.mode === 'ai' && A.moves.length === 1 && A.moves[0][1] !== A.human) return;
  A.token++; A.thinking = false;
  if (A.counted) { A.score[A.resultKey]--; A.counted = false; A.resultKey = null; A.winCells = []; }
  const removed = A.moves.pop();
  if (A.mode === 'ai' && removed[1] !== A.human && A.moves.length) A.moves.pop();
  const remaining = A.moves.slice(); A.game = new Game(); A.moves = [];
  for (const [c, p] of remaining) { A.game.make(c); A.moves.push([c, p]); }
  A.lastMove = null;
  if (remaining.length) { const col = remaining[remaining.length - 1][0]; for (let r = 0; r < ROWS; r++) if (A.game.board[r * COLS + col] !== 0) { A.lastMove = [r, col]; break; } }
}
function spawnConfetti() {
  const cols = [[250,204,21],[239,68,68],[59,130,246],[34,197,94],[255,255,255]];
  for (let i = 0; i < 120; i++) A.confetti.push({ x: Math.random() * BASE_W, y: -Math.random() * 200, vx: (Math.random() * 3 - 1.5), vy: 2 + Math.random() * 4, c: cols[Math.floor(Math.random() * 5)], s: 5 + Math.random() * 5 });
}
function quitApp() { A.state = 'quit'; A.fade = 255; }

/* ---------- update (60 Hz steps) ---------- */
function update() {
  const a = A.anim;
  if (a) {
    const target = BOARD_Y + a.row * CELL + CELL / 2;
    a.vy += 1.7; a.y += a.vy;

  }
  const g = A.game;
  if (!A.anim && g.over && !A.counted) {
    A.counted = true; const w = g.winner;
    if (w === 1 || w === -1) {
      A.winCells = findWin(g.board, w);
      A.resultKey = A.mode === 'two' ? (w === 1 ? 'you' : 'ai') : (w === A.human ? 'you' : 'ai');
      if (A.mode === 'two' || w === A.human) { spawnConfetti(); playSound('win'); }
    } else A.resultKey = 'draw';
    A.score[A.resultKey]++;
  }
  if (A.started && !g.over && !A.anim && !A.thinking && A.state === 'game' && A.mode === 'ai' && g.current !== A.human && worker) startAI();
  if (A.fade > 0) A.fade = Math.max(0, A.fade - 14);
  for (const c of A.confetti) { c.x += c.vx; c.y += c.vy; }
  A.confetti = A.confetti.filter(c => c.y < BASE_H);
  for (const p of A.particles) { p.y += p.v; if (p.y > BASE_H + p.r) { p.y = -p.r; p.x = Math.random() * BASE_W; } }
}

/* ---------- drawing ---------- */
let maskCv = null;
function buildMask() {
  maskCv = document.createElement('canvas'); maskCv.width = BOARD_W * 2; maskCv.height = BOARD_H * 2;
  const m = maskCv.getContext('2d'); m.scale(2, 2);
  m.beginPath(); m.roundRect(0, 0, BOARD_W, BOARD_H, 20);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { m.moveTo(c * CELL + CELL / 2 + HOLE_R, r * CELL + CELL / 2); m.arc(c * CELL + CELL / 2, r * CELL + CELL / 2, HOLE_R, 0, Math.PI * 2, true); }
  m.fillStyle = rgb(T.BOARD_BLUE); m.fill('evenodd');
  m.strokeStyle = rgb(T.BOARD_DARK); m.lineWidth = 4;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { m.beginPath(); m.arc(c * CELL + CELL / 2, r * CELL + CELL / 2, HOLE_R + 2, 0, Math.PI * 2); m.stroke(); }
}

}
